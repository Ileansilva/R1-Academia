<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>R1 Academia | Administração</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="index.html"><span class="brand-mark">R1</span><span><b>R1</b> ACADEMIA</span></a>
      <span class="owner-label">PAINEL DO PROPRIETÁRIO</span>
      <button class="btn btn-outline hidden" id="logoutBtn">Sair</button>
    </div>
  </header>

  <main class="admin-page">
    <section class="container" id="loginView">
      <div class="login-card card">
        <span class="eyebrow">ÁREA RESTRITA</span>
        <h1>Entrar</h1>
        <label>E-mail</label><input id="email" type="email">
        <label>Senha</label><input id="password" type="password">
        <button class="btn btn-primary full" id="loginBtn">Entrar no painel</button>
        <div class="message" id="loginMessage"></div>
      </div>
    </section>

    <section class="container hidden" id="dashboardView">
      <div class="dashboard-head">
        <div><span class="eyebrow">GESTÃO R1</span><h1>Dashboard</h1></div>
        <button class="btn btn-primary" id="refreshBtn">Atualizar dados</button>
      </div>

      <div class="kpis">
        <article><span>Total de alunos</span><b id="kpiTotal">0</b></article>
        <article><span>Ativos</span><b id="kpiActive">0</b></article>
        <article class="warn"><span>Vencem em até 5 dias</span><b id="kpiSoon">0</b></article>
        <article class="danger"><span>Vencidos</span><b id="kpiOverdue">0</b></article>
        <article><span>Receita confirmada</span><b id="kpiRevenue">R$ 0,00</b></article>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="studentsTab">Alunos</button>
        <button class="tab" data-tab="paymentsTab">Financeiro</button>
        <button class="tab" data-tab="plansTab">Planos</button>
        <button class="tab" data-tab="settingsTab">Configurações</button>
      </div>

      <section id="studentsTab" class="tab-content">
        <div class="toolbar">
          <input id="studentSearch" placeholder="Buscar aluno">
          <select id="studentFilter">
            <option value="all">Todos</option>
            <option value="soon">Vencendo em 5 dias</option>
            <option value="overdue">Vencidos</option>
            <option value="active">Ativos</option>
          </select>
        </div>
        <div id="studentsList"></div>
      </section>

      <section id="paymentsTab" class="tab-content hidden">
        <div class="section-head"><div><span class="eyebrow">FINANCEIRO</span><h2>Pagamentos e renovações</h2></div></div>
        <div id="paymentsList"></div>
      </section>

      <section id="plansTab" class="tab-content hidden">
        <div class="panel-line">
          <div><span class="eyebrow">PLANOS</span><h2>Planos cadastrados</h2></div>
          <button class="btn btn-primary" id="newPlanBtn">+ Novo plano</button>
        </div>
        <div id="plansAdminList"></div>
        <div class="card hidden" id="planForm">
          <input type="hidden" id="editPlanId">
          <div class="form-grid">
            <div class="field"><label>Nome</label><input id="planName"></div>
            <div class="field"><label>Preço</label><input id="planPrice" type="number" step="0.01"></div>
            <div class="field"><label>Duração (meses)</label><input id="planMonths" type="number" min="1"></div>
            <div class="field"><label>Ativo</label><select id="planActive"><option value="true">Sim</option><option value="false">Não</option></select></div>
          </div>
          <label>Benefícios (um por linha)</label>
          <textarea id="planBenefits" rows="5"></textarea>
          <div class="actions"><button class="btn btn-dark" id="cancelPlanBtn">Cancelar</button><button class="btn btn-primary" id="savePlanBtn">Salvar</button></div>
        </div>
      </section>

      <section id="settingsTab" class="tab-content hidden">
        <div class="card">
          <h2>Configurações</h2>
          <label>WhatsApp da academia</label>
          <input id="ownerWhatsapp" placeholder="5582999999999">
          <label>Dias de antecedência para aviso</label>
          <input id="reminderDays" type="number" min="1" max="30" value="5">
          <div class="actions"><button class="btn btn-primary" id="saveSettingsBtn">Salvar</button></div>
        </div>
      </section>
    </section>
  </main>

  <div class="modal hidden" id="studentModal">
    <div class="modal-backdrop" id="closeStudentBackdrop"></div>
    <div class="modal-box">
      <div class="modal-head">
        <div><span class="eyebrow">ALUNO</span><h2 id="modalStudentName">—</h2></div>
        <button class="icon-btn" id="closeStudentBtn">✕</button>
      </div>
      <div class="details" id="studentDetails"></div>
      <div class="alert-box" id="dueAlert"></div>
      <div class="actions wrap">
        <button class="btn btn-primary" id="sendReminderBtn">Avisar pelo WhatsApp</button>
        <button class="btn btn-dark" id="renewBtn">Confirmar pagamento e renovar</button>
      </div>
      <h3>Histórico</h3>
      <div id="renewalHistory"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
